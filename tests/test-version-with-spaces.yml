name: Test version containing spaces is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: rolldice
          version: "bad version"
      - name: Assert action failed before installing anything
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to reject a version containing spaces"
            exit 1
          fi
          if dpkg -s rolldice >/dev/null 2>&1; then
            echo "FAIL: rolldice should not have been installed"
            exit 1
          fi
          echo "PASS"
