name: Test cache save then restore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build action bundle from its own source (dist is not committed at this tag)
        run: |
          if [ -f dist/action/index.js ]; then
            echo "dist/action/index.js already present"
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.build.json
          npx rollup -c rollup.config.mjs
          test -f dist/action/index.js || { echo "FAIL: bundle not produced"; exit 1; }
      - name: Pre-install aria2 (the action's apt backend expects it; the act image lacks it)
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          if ! dpkg-query -W aria2 >/dev/null 2>&1; then
            $SUDO apt-get update -y
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2
          fi
          dpkg-query -W aria2
      - name: Ensure a cache service URL is advertised (act runs without one)
        run: |
          # @actions/cache isFeatureAvailable() only checks ACTIONS_CACHE_URL is set.
          # Under act it is unset, so the action refuses to save. Keep any real value;
          # otherwise point at an unreachable endpoint so restore/save fail softly.
          if [ -z "${ACTIONS_CACHE_URL:-}" ]; then
            echo "ACTIONS_CACHE_URL=http://127.0.0.1:1/" >> "$GITHUB_ENV"
          fi
          if [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            echo "ACTIONS_RUNTIME_TOKEN=act-placeholder" >> "$GITHUB_ENV"
          fi
      - id: ver
        name: Generate unique cache version
        run: echo "value=restore-$(date +%s)-$RANDOM" >> "$GITHUB_OUTPUT"
      - id: first
        uses: .
        with:
          packages: tree
          version: ${{ steps.ver.outputs.value }}
      - name: Assert first run was a cache miss
        env:
          CACHE_HIT: ${{ steps.first.outputs.cache-hit }}
          PKGS: ${{ steps.first.outputs.package-version-list }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "package-version-list: $PKGS"
          if [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache miss for a fresh version"
            exit 1
          fi
          if ! echo "$PKGS" | grep -qE '^tree(:[a-z0-9]+)?=[^,]+$'; then
            echo "FAIL: unexpected package list"
            exit 1
          fi
          echo "PASS"
      - id: second
        uses: .
        with:
          packages: tree
          version: ${{ steps.ver.outputs.value }}
      - name: Assert second run is consistent with the first
        env:
          CACHE_HIT: ${{ steps.second.outputs.cache-hit }}
          PKGS1: ${{ steps.first.outputs.package-version-list }}
          PKGS2: ${{ steps.second.outputs.package-version-list }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "first: $PKGS1"
          echo "second: $PKGS2"
          # A real cache backend may be unavailable under act, so a hit cannot be
          # guaranteed; require a valid boolean and identical outputs.
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit must be true or false"
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Cache was restored on second run"
            if [ "$PKGS1" != "$PKGS2" ]; then
              echo "FAIL: restored package list differs from the first run"
              exit 1
            fi
          else
            echo "NOTE: cache backend unavailable under act; second run did not restore"
            # Without a cache hit, the package is already installed from the
            # first run, so the action reports either the same list or an empty
            # list (nothing newly installed). Anything else is a bug.
            if [ -n "$PKGS2" ] && [ "$PKGS1" != "$PKGS2" ]; then
              echo "FAIL: second run reported an unexpected package list"
              exit 1
            fi
          fi
          command -v tree || { echo "FAIL: tree missing after second run"; exit 1; }
          echo "PASS"
