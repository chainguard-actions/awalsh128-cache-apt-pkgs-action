name: Test empty packages with error behavior (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          packages: ""
          empty_packages_behavior: error
        continue-on-error: true

      - name: Assert action failed as expected for empty packages with error behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when packages is empty and empty_packages_behavior is 'error', got outcome: '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when packages is empty with error behavior"
