name: Test empty packages with warn behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          packages: ""
          empty_packages_behavior: warn

      - name: Assert action completed without failure
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # When packages is empty and behavior is warn, action should succeed
          # cache-hit will be false since no packages were installed (CACHE_KEY is empty)
          echo "PASS: action completed with warn behavior for empty packages"
