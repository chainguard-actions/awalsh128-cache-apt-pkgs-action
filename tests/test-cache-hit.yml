name: Test cache hit on second run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup fake apt-fast to avoid network download
        run: |
          if ! command -v apt-fast > /dev/null 2>&1; then
            printf '#!/bin/bash\nexec apt-get "$@"\n' | sudo tee /usr/local/bin/apt-fast > /dev/null
            sudo chmod +x /usr/local/bin/apt-fast
          fi
          apt-fast --version || true

      # First run - should install and cache
      - id: first-run
        uses: .
        with:
          packages: tree
          version: "cache-hit-test-v1"
        continue-on-error: true

      - name: Assert first run completed
        env:
          OUTCOME: ${{ steps.first-run.outcome }}
          PKG_LIST: ${{ steps.first-run.outputs.package-version-list }}
        run: |
          echo "first-run outcome: $OUTCOME"
          echo "first-run package-version-list: $PKG_LIST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PKG_LIST" ]; then
              echo "FAIL: first run package-version-list should not be empty"
              exit 1
            fi
            echo "PASS: first run completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: first run failed gracefully (cache service may be unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Second run with same packages and version - may get cache hit
      - id: second-run
        uses: .
        with:
          packages: tree
          version: "cache-hit-test-v1"
        continue-on-error: true

      - name: Assert second run completed and outputs are valid
        env:
          FIRST_OUTCOME: ${{ steps.first-run.outcome }}
          SECOND_OUTCOME: ${{ steps.second-run.outcome }}
          CACHE_HIT: ${{ steps.second-run.outputs.cache-hit }}
          PKG_LIST: ${{ steps.second-run.outputs.package-version-list }}
        run: |
          echo "first-run outcome: $FIRST_OUTCOME"
          echo "second-run outcome: $SECOND_OUTCOME"
          echo "second-run cache-hit: $CACHE_HIT"
          echo "second-run package-version-list: $PKG_LIST"

          if [ "$SECOND_OUTCOME" = "success" ]; then
            if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
              echo "FAIL: cache-hit should be 'true' or 'false', got: '$CACHE_HIT'"
              exit 1
            fi
            if [ -z "$PKG_LIST" ]; then
              echo "FAIL: second run package-version-list should not be empty"
              exit 1
            fi
            echo "PASS: second run completed with cache-hit='$CACHE_HIT'"
          elif [ "$SECOND_OUTCOME" = "failure" ]; then
            echo "PASS: second run failed gracefully (cache service may be unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$SECOND_OUTCOME'"
            exit 1
          fi
