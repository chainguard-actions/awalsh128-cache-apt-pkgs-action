name: Test nonexistent package fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: this-package-does-not-exist-xyz123
          version: nonexistent-test
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PKGS: ${{ steps.action.outputs.package-version-list }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package-version-list: $PKGS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent package"
            exit 1
          fi
          echo "PASS"
